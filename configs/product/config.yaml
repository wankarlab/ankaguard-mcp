# Default configuration of the product build (build tag `product`).
#
# Safe by default: local authentication, loopback listeners, real money
# disabled, and no credentials in this file. Secrets and exchange credentials
# come from the environment only (see deploy/product/.env, generated by the
# installer): ${VAR} placeholders below are documentation, the server reads
# the variables directly.
#
# Run: ./trading-mcp-server -config configs/product/config.yaml

server:
  host: "127.0.0.1"
  bind_address: "127.0.0.1"   # applies to :10600, the REST API and the gateway; MCP_BIND_ADDRESS overrides it
  port: 10600
  mode: "production"
  protocol: "http"
  read_timeout: 30
  write_timeout: 120
  idle_timeout: 120
  max_header_bytes: 1048576

gateway:
  port: 9090                  # GATEWAY_PORT overrides it

auth:
  mode: "standalone"          # local operator login + agent tokens (no RantiPay auth service)
  data_dir: "data/auth"       # password hash, signing secret and installed license live here

trading:
  live_enabled: false         # YAML fallback of the trading.live_enabled switch; real money is opt-in

gocryptotrader:
  grpc_address: "localhost:9052"   # GCT_GRPC_ADDRESS overrides it
  # username/password: GCT_USERNAME / GCT_PASSWORD (env only). Without them the
  # server still starts and reports that GoCryptoTrader is unreachable.
  timeout: 30s
  max_retries: 3
  retry_backoff: 2s

# Conservative hard caps (USD). The risk sentinel enforces the dynamic parameter
# risk.max_order_size_usd (registry default 2.0, change it from the console);
# without Postgres it falls back to that registry default, never to "no cap".
# The cap also applies to market orders in the product
# (risk.enforce_cap_on_market_orders defaults to true in this build).
risk_limits:
  max_order_size_usd: 2.0
  max_daily_loss_usd: 20.0
  max_position_size_usd: 50.0
  max_open_orders: 3
  max_exposure_per_pair_usd: 50.0

# Market data is public; no key is needed for the paper profile. Real orders
# additionally need trading.live_enabled=true, a Pro license and a live token.
exchanges:
  - name: "kucoin"
    enabled: true
    sandbox: false

logging:
  level: "info"
  format: "json"
  output: "stdout"
  file: "logs/trading-mcp.log"
  max_size_mb: 100
  max_backups: 5
  max_age_days: 30

monitoring:
  prometheus_enabled: true
  prometheus_port: 9091
  health_check_interval: 30s
  metrics_enabled: true

audit:
  enabled: true
  log_file: "logs/audit.log"
  log_all_requests: true
  log_all_orders: true

# Autonomous services are not part of the product: nothing starts them.
ai_bot:
  auto_start: false

scalping:
  enabled: false
  auto_start: false
  api:
    port: "8081"              # REST API (:8081) that the console talks to; bound to server.bind_address

master_agent:
  enabled: false
  auto_start: false

multi_pair:
  enabled: false

multi_user:
  enabled: false

# Postgres holds the runtime-tunable parameters (hot reload). Optional: without
# it the server runs on the YAML defaults and says so at boot.
postgres:
  config_db:
    host: ""                   # set to the Postgres host (e.g. "postgres" in Docker)
    port: 5432
    database: trading_config
    user: trading
    password: "${TRADING_CONFIG_DB_PASSWORD}"
    max_connections: 10
    min_connections: 2
    max_conn_lifetime: 1h
    health_check_period: 30s
